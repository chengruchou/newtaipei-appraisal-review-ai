[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "newtaipei-appraisal-review-ai"
version = "0.1.0"
description = "Auditable AI-assisted appraisal review; local reviewer workflow requires Linux or macOS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "PyYAML>=6.0,<7",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
privacy = ["cryptography>=46,<51"]
documents = ["pymupdf>=1.26,<2"]
pdf = [
  "pypdf>=6,<7",
  "reportlab>=4.4,<5",
]
aws = [
  "boto3>=1.40,<2",
  "mangum>=0.19,<1",
]
dev = [
  "cryptography>=46,<51",
  "pymupdf>=1.26,<2",
  "fonttools>=4.59,<5",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "boto3-stubs>=1.40,<2",
  "mypy>=1.17,<2",
  "pypdf>=6,<7",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "reportlab>=4.4,<5",
  "ruff>=0.12,<1",
  "types-PyYAML>=6.0,<7",
  "types-reportlab>=4.4,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/appraisal_review"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["appraisal_review"]

[tool.coverage.run]
source = ["appraisal_review"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
