AWSTemplateFormatVersion: '2010-09-09'
Description: Private immutable images for the appraisal sandbox; bootstrap before runtime creation.
Metadata:
  com.aws.cloudformation.Context:
    ref:
      - at: docs/runtime-deployment.md
        has: Deployment order, image verification and retained-resource cleanup
Parameters:
  DeploymentPrefix:
    Type: String
    AllowedPattern: '[a-z][a-z0-9]{3,19}'
    Description: Unique sandbox identifier, shared with the runtime stack.
  Environment:
    Type: String
    AllowedValues: [sandbox]
  Owner:
    Type: String
    MinLength: 1
    MaxLength: 128
    Description: Team identifier, not personal information.
  ExpiresOn:
    Type: String
    AllowedPattern: '\d{4}-\d{2}-\d{2}'
    Description: Operator cleanup review date; tags do not delete resources.
Resources:
  Images:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Bootstrap breaks the image-before-runtime creation dependency.
        must:
          - Preserve immutable digests needed for rollback; no automatic image expiration.
          - Only the two named Lambda functions may use the service pull policy.
    Properties:
      RepositoryName: !Sub '${DeploymentPrefix}-runtime'
      EmptyOnDelete: false
      EncryptionConfiguration:
        EncryptionType: AES256
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      RepositoryPolicyText:
        Version: '2012-10-17'
        Statement:
          - Sid: LambdaImageRetrieval
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer]
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnEquals:
                aws:SourceArn:
                  - !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${DeploymentPrefix}-dispatcher'
                  - !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${DeploymentPrefix}-worker'
      Tags:
        - {Key: Project, Value: appraisal-review}
        - {Key: Environment, Value: !Ref Environment}
        - {Key: DeploymentPrefix, Value: !Ref DeploymentPrefix}
        - {Key: Owner, Value: !Ref Owner}
        - {Key: ExpiresOn, Value: !Ref ExpiresOn}
Outputs:
  RepositoryUri:
    Description: Pass the verified image digest from this repository to the runtime stack.
    Value: !GetAtt Images.RepositoryUri
  RepositoryArn:
    Description: Repository boundary for the separately authorized image publisher.
    Value: !GetAtt Images.Arn
