name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Branch naming
        env:
          REVIEW_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: python -c 'import os, runpy; runpy.run_path("scripts/check_submission.py")["check_branch"](os.environ["REVIEW_BRANCH"])'
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Types
        run: mypy src
      - name: Test
        run: pytest --cov=appraisal_review --cov-config=pyproject.toml --cov-report=term-missing
      - name: Reviewed full-case goldens
        run: python scripts/generate_goldens.py
      - name: Local Runtime protocol and mocked cloud smoke
        run: python -m pytest cloud_tests
      - name: Local HTTP and invocation contracts
        run: |
          python scripts/http_smoke.py
          python scripts/local_service_smoke.py
      - name: CloudFormation smoke templates
        run: |
          python -m pip install -r cloud_tests/requirements-dev.txt
          cfn-lint cloud_tests/image-stack.json cloud_tests/runtime-stack.json infra/documents/stack.json infra/runtime/image-stack.yaml infra/runtime/runtime-stack.yaml
