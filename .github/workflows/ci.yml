name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Types
        run: mypy src
      - name: Test
        run: pytest --cov=appraisal_review --cov-report=term-missing
      - name: Local Runtime protocol and mocked cloud smoke
        run: python -m pytest cloud_tests
      - name: CloudFormation smoke templates
        run: |
          python -m pip install -r cloud_tests/requirements-dev.txt
          cfn-lint cloud_tests/image-stack.json cloud_tests/runtime-stack.json
