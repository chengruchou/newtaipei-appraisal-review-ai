name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Branch naming
        env:
          REVIEW_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: python -c 'import os, runpy; runpy.run_path("scripts/check_submission.py")["check_branch"](os.environ["REVIEW_BRANCH"])'
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Types
        run: mypy src
      - name: Test
        run: pytest --cov=appraisal_review --cov-config=pyproject.toml --cov-report=term-missing
      - name: Reviewed full-case goldens
        run: python scripts/generate_goldens.py
      - name: Published OpenAPI matches the mounted routes
        run: python scripts/export_openapi.py
      - name: Local Runtime protocol and mocked cloud smoke
        run: python -m pytest cloud_tests
      - name: CloudFormation smoke templates
        run: |
          python -m pip install -r cloud_tests/requirements-dev.txt
          cfn-lint cloud_tests/image-stack.json cloud_tests/runtime-stack.json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Generated client matches the published contract
        run: |
          npm run generate
          git diff --exit-code src/api/schema.d.ts
      - name: Types
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Build artifact carries no secret or source map
        run: npm run check:artifact
      - name: Browser smoke
        run: |
          npx playwright install --with-deps chromium firefox
          npm run e2e
