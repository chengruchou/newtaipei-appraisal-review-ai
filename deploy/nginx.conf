# The workbench frontend and its API share one container so the service keeps the
# numeric loopback bind and authority it requires. Only this origin is published.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    server_tokens off;

    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # The frontend is built with no VITE_API_BASE_URL, so it calls same-origin /v1/.
        location /v1/ {
            proxy_pass http://127.0.0.1:8765;
            # The service rejects any request whose Host is not its own loopback
            # authority, so the proxy presents that authority verbatim.
            proxy_set_header Host 127.0.0.1:8765;
            proxy_set_header Authorization $http_authorization;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
            client_max_body_size 64m;
        }

        # Client-side routes such as /jobs/:id and /tasks/:id resolve to the app shell.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
